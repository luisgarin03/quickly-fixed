name: quickly-local-debug
services:
  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: quickly_local
      POSTGRES_PASSWORD: quickly_local_only
      POSTGRES_DB: quickly_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickly_local -d quickly_local"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
